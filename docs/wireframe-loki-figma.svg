    <rect class="subtle" x="52" y="441" width="456" height="55" />
    <text x="67" y="464" font-family="Arial, sans-serif" font-size="15px" font-weight="400" fill="#555555">Khách · Login · Sign up</text>
    <text x="67" y="483" font-family="Arial, sans-serif" font-size="13px" font-weight="400" fill="#666666">Profile tạm lưu trong sessionStorage</text>
  </g>

