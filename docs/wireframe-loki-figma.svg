<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1260" viewBox="0 0 1800 1260">
  <defs>
    <style>
      .bg { fill: #f1f1f1; }
      .frame { fill: #fff; stroke: #454545; stroke-width: 2; }
      .panel { fill: #fafafa; stroke: #777; stroke-width: 1.5; }
      .subtle { fill: #f0f0f0; stroke: #999; stroke-width: 1; }
      .line { stroke: #666; stroke-width: 1.5; fill: none; }
      .dash { stroke: #888; stroke-width: 1.2; stroke-dasharray: 6 5; fill: none; }
      .title { font-family: Arial, sans-serif; font-size: 29px; font-weight: 700; fill: #171717; }
      .frame-title { font-family: Arial, sans-serif; font-size: 20px; font-weight: 700; fill: #222; }
      .label { font-family: Arial, sans-serif; font-size: 17px; font-weight: 400; fill: #333; }
      .small { font-family: Arial, sans-serif; font-size: 15px; font-weight: 400; fill: #555; }
      .tiny { font-family: Arial, sans-serif; font-size: 13px; font-weight: 400; fill: #666; }
      .button { fill: #fff; stroke: #555; stroke-width: 1.5; }
      .primary { fill: #e7e7e7; stroke: #333; stroke-width: 1.8; }
      .connector { stroke: #777; stroke-width: 1.4; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#777" />
    </marker>
  </defs>
  <rect class="bg" width="1800" height="1260" />
  <text x="40" y="48" font-family="Arial, sans-serif" font-size="29px" font-weight="700" fill="#171717">LOKI — WIREFRAME</text>
  <text x="40" y="76" font-family="Arial, sans-serif" font-size="15px" font-weight="400" fill="#555555">Bước 2 · Phác bố cục chức năng · Low fidelity</text>

  <!-- A: Dashboard -->
