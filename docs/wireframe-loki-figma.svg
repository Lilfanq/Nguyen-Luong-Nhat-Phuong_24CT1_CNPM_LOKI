    <text x="429" y="179" font-family="Arial, sans-serif" font-size="13px" font-weight="400" fill="#666666">Product Lab</text>
    <rect class="button" x="512" y="160" width="28" height="29" />
    <text x="521" y="179" font-family="Arial, sans-serif" font-size="13px" font-weight="400" fill="#666666">U</text>

    <text x="52" y="226" font-family="Arial, sans-serif" font-size="17px" font-weight="400" fill="#333333">Thiết bị</text>
